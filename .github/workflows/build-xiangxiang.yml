name: Build XiangXiang Input

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-xiangxiang.yml"
      - "xiangxiang/**"
      - "personal-english-input/rime/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout XiangXiang sources
        uses: actions/checkout@v6

      - name: Checkout official Squirrel
        uses: actions/checkout@v6
        with:
          repository: rime/squirrel
          ref: master
          path: upstream
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Apply XiangXiang branding
        run: python3 xiangxiang/brand_upstream.py upstream

      - name: Install upstream binary dependencies
        working-directory: upstream
        run: bash ./action-install.sh

      - name: Build universal app
        working-directory: upstream
        run: make release ARCHS="arm64 x86_64" BUILD_UNIVERSAL=1

      - name: Add personal-English defaults
        run: |
          app="upstream/build/Build/Products/Release/XiangXiangInput.app"
          defaults="$app/Contents/SharedSupport/XiangXiangDefaults"
          test -d "$app"
          mkdir -p "$defaults/lua"
          cp personal-english-input/rime/sentence_recorder.lua "$defaults/lua/"
          cp personal-english-input/rime/personal_translate.lua "$defaults/lua/"
          cp xiangxiang/defaults/default.custom.yaml "$defaults/"
          cp xiangxiang/defaults/luna_pinyin.custom.yaml "$defaults/"
          printf '#rev=0\n' > "$defaults/personal_translate.tsv"
          codesign --force --deep --sign - \
            --entitlements xiangxiang/adhoc-entitlements.plist \
            "$app"

      - name: Verify branded app
        run: python3 xiangxiang/verify_app.py upstream/build/Build/Products/Release/XiangXiangInput.app

      - name: Build user-local test bundle
        run: |
          app="upstream/build/Build/Products/Release/XiangXiangInput.app"
          bundle="dist/XiangXiangInput-0.1.10-user"
          mkdir -p "$bundle"
          helper="$bundle/XiangXiangDictionaryImporter.app"
          mkdir -p "$helper/Contents/MacOS"
          cp xiangxiang/dictionary_import_app/Info.plist "$helper/Contents/Info.plist"
          for arch in arm64 x86_64; do
            swiftc -target "${arch}-apple-macosx13.0" \
              xiangxiang/dictionary_import_app/main.swift \
              -o "${RUNNER_TEMP}/XiangXiangDictionaryImporter-${arch}"
          done
          lipo -create \
            "${RUNNER_TEMP}/XiangXiangDictionaryImporter-arm64" \
            "${RUNNER_TEMP}/XiangXiangDictionaryImporter-x86_64" \
            -output "$helper/Contents/MacOS/XiangXiangDictionaryImporter"
          codesign --force --sign - "$helper"
          codesign --verify --deep --strict --verbose=2 "$helper"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$bundle/XiangXiangInput.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$helper" "$bundle/XiangXiangDictionaryImporter.app.zip"
          rm -r "$helper"
          cp xiangxiang/package/install-user.command "$bundle/Install XiangXiangInput.command"
          cp xiangxiang/adhoc-entitlements.plist "$bundle/"
          cp xiangxiang/maintenance-entitlements.plist "$bundle/"
          cp xiangxiang/package/README.txt "$bundle/README.txt"
          cp xiangxiang/dictionary_import.py "$bundle/dictionary_import.py"
          cp xiangxiang/package/导入词库.command "$bundle/导入词库.command"
          cp xiangxiang/package/词库模板.csv "$bundle/词库模板.csv"
          chmod +x "$bundle/Install XiangXiangInput.command"
          chmod +x "$bundle/导入词库.command"

      - name: Verify packaged app round trip
        run: |
          mkdir -p staging/roundtrip
          ditto -x -k \
            dist/XiangXiangInput-0.1.10-user/XiangXiangInput.app.zip \
            staging/roundtrip
          codesign --verify --deep --strict --verbose=2 \
            staging/roundtrip/XiangXiangInput.app
          python3 xiangxiang/verify_app.py staging/roundtrip/XiangXiangInput.app
          ditto -x -k \
            dist/XiangXiangInput-0.1.10-user/XiangXiangDictionaryImporter.app.zip \
            staging/roundtrip
          codesign --verify --deep --strict --verbose=2 \
            staging/roundtrip/XiangXiangDictionaryImporter.app

      - name: Upload user-local test bundle
        uses: actions/upload-artifact@v4
        with:
          name: XiangXiangInput-0.1.10-user
          path: dist/XiangXiangInput-0.1.10-user
          if-no-files-found: error
